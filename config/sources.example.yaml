# Gmail category labels:
# - ai-newsPaper
# - cloud-data-newspaper
# - cyber-newspaper
# - dev-newspaper
# - product-business-newspaper
sources:
  - type: gmail
    id: alphasignal
    name: AlphaSignal
    enabled: true
    category: AI
    gmail_query: 'label:ai-newsPaper from:news@alphasignal.ai'
    gmail_filter:
      label: ai-newsPaper
      criteria:
        from: news@alphasignal.ai
    # Leave unset to count each issue's stories first, drop its sponsored entries, and keep the
    # strongest EXTRACT_KEEP_SHARE of the rest. Set 1 for a newsletter that sends one article, essay,
    # interview, or podcast episode an issue: the extractor then returns one item for the whole piece
    # rather than one per section. Any other number is a fixed cap, with no count.
    # max_items_per_email: 1

  # Keep disabled until the Hacker News source is configured for your digest.
  - type: hackernews
    id: hn-best
    name: Hacker News Best
    enabled: false
    category: DEV
    feed: beststories
    max_story_candidates: 60
    max_articles_per_run: 10
    max_age_hours: 36
    min_score: 0
    min_comments: 0
    allow_metadata_fallback: false
