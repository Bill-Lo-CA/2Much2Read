name: validation

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.22"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src scripts tests

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv build

  # The declared range is >=3.11,<3.14, and the job above runs whichever Python the runner has. Two
  # edges of the range are tested as well: 3.13 changed how Path.resolve treats a symlink loop, which
  # a permissions test assumed until it ran there.
  python-versions:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.22"
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Test
        run: uv run pytest -q
