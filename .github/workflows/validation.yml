name: validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.22"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src scripts

      - name: Shell scripts
        run: |
          # sh takes one command file and turns every later word into a positional parameter, so
          # passing the whole glob would parse the first script and silently ignore the rest.
          for script in scripts/*.sh scripts/lib/*.sh; do sh -n "$script"; done
          uv run shellcheck -s sh scripts/*.sh scripts/lib/*.sh

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv build
